name: Deploy test

on:
  workflow_dispatch:
  push:
    branches:
      - testing

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, dom, filter, gd, json, zip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-interaction

      - name: Install NPM dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H -p 48221 ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Finalize on server
        run: |
          ssh -p 48221 ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            set -e
            cd /var/www/muscle-arena-test

            echo "=== Clean old cache (no Laravel) ==="
            rm -rf storage/framework/cache/*
            rm -rf storage/framework/views/*
            rm -rf storage/framework/sessions/*
            rm -rf bootstrap/cache/*.php

            echo "=== Fix permissions ==="
            chown -R bt:www-data storage bootstrap/cache
            chmod -R 775 storage bootstrap/cache

            echo "=== Laravel clean ==="
            sudo -u www-data php artisan optimize:clear

            echo "=== Laravel config cache ==="
            sudo -u www-data php artisan config:cache

          EOF
